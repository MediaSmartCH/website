name: Update portfolio screenshots

on:
  schedule:
    - cron: '0 23 * * 1'
  workflow_dispatch:

concurrency:
  group: update-portfolio-screenshots
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      SCREENSHOT_BRANCH: portfolio-screenshots-update

    steps:
      - name: Checkout repository
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          # Authenticate git with the PR-creation PAT so the screenshot branch
          # push isn't attributed to GITHUB_TOKEN — pushes authored by the
          # default token are silently exempt from triggering required CI
          # workflows, which leaves PRs stuck on "Expected — Waiting for
          # status to be reported" forever. Falls back to GITHUB_TOKEN if the
          # secret isn't configured yet.
          token: ${{ secrets.SCREENSHOT_PR_TOKEN != '' && secrets.SCREENSHOT_PR_TOKEN || github.token }}

      - name: Setup Node.js
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install --no-save puppeteer@24.40.0

      - name: Capture screenshots
        run: node scripts/capture-screenshots.mjs

      - name: Commit screenshots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$SCREENSHOT_BRANCH"
          git add public/screenshots/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update portfolio screenshots [skip ci]"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push screenshot branch
        if: steps.commit.outputs.has_changes == 'true'
        run: git push --force-with-lease --set-upstream origin "$SCREENSHOT_BRANCH"

      - name: Open or update pull request
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOT_PR_TOKEN != '' && secrets.SCREENSHOT_PR_TOKEN || github.token }}
        run: |
          existing_pr_url="$(gh pr list \
            --head "$SCREENSHOT_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // ""')"

          pr_url="$existing_pr_url"

          if [ -z "$pr_url" ]; then
            pr_body_file="$(mktemp)"
            trap 'rm -f "$pr_body_file"' EXIT
            cat <<'EOF' > "$pr_body_file"
          ## Summary

          - refresh the generated portfolio screenshots

          ## Notes

          - created automatically by the screenshot workflow
          EOF

            if ! pr_url="$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$SCREENSHOT_BRANCH" \
              --title "chore: update portfolio screenshots" \
              --body-file "$pr_body_file")"; then
              echo "::warning::GitHub Actions could not create the pull request. The screenshots were pushed to '$SCREENSHOT_BRANCH'."
              {
                echo "## Screenshot update pending"
                echo
                echo "- branch: \`$SCREENSHOT_BRANCH\`"
                echo "- reason: GitHub Actions is not allowed to create pull requests in this repository with the current token"
                echo "- next step: open a pull request manually, or add a \`SCREENSHOT_PR_TOKEN\` repository secret with a token that can create pull requests"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "Pull request: $pr_url"

          if ! gh pr merge "$pr_url" --squash --delete-branch --auto; then
            echo "::warning::Could not enable auto-merge on $pr_url — merge it manually once checks pass."
          fi
