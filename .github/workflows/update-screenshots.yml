name: Update portfolio screenshots

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC = minuit CET (UTC+1)
  workflow_dispatch:       # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: pnpm add --no-save puppeteer@24.40.0

      - name: Capture screenshots
        run: node scripts/capture-screenshots.mjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/screenshots/
          git diff --staged --quiet || (git commit -m "chore: update portfolio screenshots [skip ci]" && git push)
