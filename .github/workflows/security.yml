name: Security & Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup pnpm
        uses: pnpm/action-setup@6e7bdbda5fe05107efc88b23b7ed00aa05f84ca0
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # The toolchain's Node, not the runtime's. pnpm loads node:sqlite on
          # this runner and dies on Node 20 with ERR_UNKNOWN_BUILTIN_MODULE, so
          # CI needs 22 even though engines.node pins 20.x for the Vercel
          # functions in api/. That is fine: CI only runs the build tools, and
          # Vercel builds and runs the functions itself on the pinned version.
          # (An earlier revision of this file set 20 here to "match production"
          # and broke every run — do not reinstate it.)
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit production dependencies
        # npm audit requires an npm lockfile, but pnpm's installed node_modules
        # tree exposes link: entries that npm does not understand in Actions.
        # Build an isolated audit workspace from package.json only so the audit
        # gate stays enforced without mixing npm with pnpm's workspace layout.
        run: |
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/npm-audit-XXXXXX")"
          cp package.json "$audit_dir/package.json"

          if [ -f .npmrc ]; then
            cp .npmrc "$audit_dir/.npmrc"
          fi

          cd "$audit_dir"
          npm install --package-lock-only --omit=dev --ignore-scripts --legacy-peer-deps
          npm audit --omit=dev

      - name: Install dependencies
        # GitHub Actions currently sees this tracked lockfile as broken even
        # though the issue is not reproducible locally, so the security gate must
        # install without the frozen assertion to keep audit/build enforceable.
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        # tsc silently checked nothing for a long time: it aborted on config
        # deprecations and no script ever invoked it. Gate it here so that
        # cannot happen again unnoticed.
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build check
        run: pnpm build
