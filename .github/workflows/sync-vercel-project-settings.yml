name: Sync Vercel Settings

on:
  workflow_dispatch:

concurrency:
  group: sync-vercel-project-settings
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"

      - name: Validate Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing GitHub Actions secret VERCEL_TOKEN."
            echo "Create a long-lived Vercel access token in Account Settings -> Tokens before running this workflow."
            exit 1
          fi

          status_code="$(curl -sS -o /tmp/vercel-user.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user)"

          if [ "$status_code" != "200" ]; then
            echo "VERCEL_TOKEN is invalid or expired."
            cat /tmp/vercel-user.json
            exit 1
          fi

      - name: Sync Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/sync-vercel-project-settings.mjs

      - name: Sync Vercel domain settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/sync-vercel-domain-settings.mjs
