<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image — MediaSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F7F8FF;
      font-family: 'Red Hat Display', sans-serif;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    .blob-purple {
      width: 560px; height: 560px;
      background: radial-gradient(circle at 40% 40%, rgba(181,20,253,0.10) 0%, transparent 65%);
      top: -180px; left: -100px;
    }
    .blob-blue {
      width: 480px; height: 480px;
      background: radial-gradient(circle at 60% 60%, rgba(95,117,245,0.10) 0%, transparent 65%);
      bottom: -150px; right: -80px;
    }
    .blob-center {
      width: 700px; height: 300px;
      background: radial-gradient(ellipse at 50% 50%, rgba(95,117,245,0.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .wave-bg {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 120px;
      text-align: center;
    }

    .logo-img {
      height: 42px;
      width: auto;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.08;
      color: #14172D;
      letter-spacing: -0.025em;
      max-width: 880px;
      margin-bottom: 20px;
    }
    h1 .grad {
      background: linear-gradient(135deg, #B514FD 0%, #5F75F5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 19px;
      font-weight: 400;
      color: #6B7A99;
      line-height: 1.6;
      max-width: 660px;
      margin-bottom: 36px;
    }

    .pills {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(95,117,245,0.07);
      border: 1.5px solid rgba(95,117,245,0.18);
      border-radius: 100px;
      padding: 10px 22px;
    }
    .pill-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pill-label {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #3A4680;
      white-space: nowrap;
    }

    .bottom-url {
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: rgba(20,23,45,0.30);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="blob blob-purple"></div>
  <div class="blob blob-blue"></div>
  <div class="blob blob-center"></div>

  <svg class="wave-bg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <path d="M-80 630 Q120 480 300 550 Q480 620 580 490 Q680 360 800 440 Q920 520 1050 420 Q1100 390 1200 410 L1200 630 Z"
          fill="rgba(95,117,245,0.06)"/>
    <path d="M600 630 Q750 560 900 580 Q1050 600 1200 530 L1200 630 Z"
          fill="rgba(181,20,253,0.04)"/>
    <path d="M900 0 Q1000 80 1100 40 Q1150 20 1200 60 L1200 0 Z"
          fill="rgba(181,20,253,0.05)"/>
  </svg>

  <div class="container">
    <img class="logo-img" src="/logo-header.png" alt="MediaSmart">

    <h1 id="headline"></h1>
    <p class="subtitle" id="subtitle"></p>

    <div class="pills" id="pills"></div>

    <span class="bottom-url">mediasmart.ch</span>
  </div>

  <script>
    const content = {
      fr: {
        headline: '<span class="grad">Solutions IT</span> pour entreprises<br>et indépendants en Suisse',
        subtitle: 'Création de sites web, maintenance, cybersécurité,<br>sauvegarde et support informatique en Suisse romande.',
        pills: [
          { label: 'Création web',          dot: 'linear-gradient(135deg,#B514FD,#5F75F5)' },
          { label: 'Maintenance & sécurité', dot: 'linear-gradient(135deg,#5F75F5,#59C3FF)' },
          { label: 'Support IT',             dot: 'linear-gradient(135deg,#B514FD,#5F75F5)' },
        ],
      },
      en: {
        headline: '<span class="grad">IT Solutions</span> for businesses<br>and freelancers in Switzerland',
        subtitle: 'Website creation, maintenance, cybersecurity,<br>backup and IT support in French-speaking Switzerland.',
        pills: [
          { label: 'Website creation',      dot: 'linear-gradient(135deg,#B514FD,#5F75F5)' },
          { label: 'Maintenance & security', dot: 'linear-gradient(135deg,#5F75F5,#59C3FF)' },
          { label: 'IT Support',             dot: 'linear-gradient(135deg,#B514FD,#5F75F5)' },
        ],
      },
    };

    const lang = new URLSearchParams(location.search).get('lang') || 'fr';
    const c = content[lang] || content.fr;

    document.documentElement.lang = lang;
    document.getElementById('headline').innerHTML = c.headline;
    document.getElementById('subtitle').innerHTML = c.subtitle;
    document.getElementById('pills').innerHTML = c.pills.map(p => `
      <div class="pill">
        <div class="pill-dot" style="background:${p.dot}"></div>
        <span class="pill-label">${p.label}</span>
      </div>
    `).join('');
  </script>
</body>
</html>
