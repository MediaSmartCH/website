name: Update portfolio screenshots

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC = minuit CET (UTC+1)
  workflow_dispatch:       # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Use a Node 24-based action runtime to avoid the GitHub deprecation warning.
        uses: actions/checkout@v5

      - name: Setup Node.js
        # Keep the project runtime on Node 20 while the action itself runs on Node 24.
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer --no-save

      - name: Capture screenshots
        run: node scripts/capture-screenshots.mjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/screenshots/
          git diff --staged --quiet || (git commit -m "chore: update portfolio screenshots [skip ci]" && git push)
