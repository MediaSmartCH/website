name: Security & Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@6e7bdbda5fe05107efc88b23b7ed00aa05f84ca0
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # Matches engines.node in package.json, which is what Vercel reads to
          # pick the runtime for the functions in api/. Building on the same
          # version the code is deployed on. (The previous comment here claimed
          # pnpm 10.32.1 needs Node >= 22.13 for node:sqlite; that package
          # declares >=18.12 and its binary contains no reference to it.)
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit production dependencies
        # npm audit requires an npm lockfile, but pnpm's installed node_modules
        # tree exposes link: entries that npm does not understand in Actions.
        # Build an isolated audit workspace from package.json only so the audit
        # gate stays enforced without mixing npm with pnpm's workspace layout.
        run: |
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/npm-audit-XXXXXX")"
          cp package.json "$audit_dir/package.json"

          if [ -f .npmrc ]; then
            cp .npmrc "$audit_dir/.npmrc"
          fi

          cd "$audit_dir"
          npm install --package-lock-only --omit=dev --ignore-scripts --legacy-peer-deps
          npm audit --omit=dev

      - name: Install dependencies
        # GitHub Actions currently sees this tracked lockfile as broken even
        # though the issue is not reproducible locally, so the security gate must
        # install without the frozen assertion to keep audit/build enforceable.
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        # tsc silently checked nothing for a long time: it aborted on config
        # deprecations and no script ever invoked it. Gate it here so that
        # cannot happen again unnoticed.
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build check
        run: pnpm build
