name: Sync Vercel Settings

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-vercel-project-settings.yml
      - config/vercel-domains.json
      - config/vercel-project-context.json
      - config/vercel-project-settings.json
      - scripts/sync-vercel-domain-settings.mjs
      - scripts/sync-vercel-project-settings.mjs

concurrency:
  group: sync-vercel-project-settings
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"

      - name: Sync Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/sync-vercel-project-settings.mjs

      - name: Sync Vercel domain settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/sync-vercel-domain-settings.mjs
