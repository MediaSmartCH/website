name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: ["production"]
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Initialize CodeQL
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        # Pin the action to an immutable commit to reduce supply-chain risk.
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13
